<figure>
  <div class="scroller">
  <svg viewBox="0 0 720 582" role="img" aria-label="Wireframe of the batch search result screen. A search bar holds four comma-separated terms. A summary line reads three available, one out of stock. An available group lists three products with stock counts and locations, followed by a primary action to add all three to the basket. An unavailable group lists the fourth product greyed out with a substitute suggestion and its own add link. A basket bar at the bottom shows three items and a plan route action.">
    <defs><marker id="h4" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><polygon points="0,0 10,4 0,8" fill="currentColor"/></marker></defs>
    <g font-family="IBM Plex Sans Condensed, sans-serif">

      <rect x="40" y="18" width="640" height="38" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <text x="56" y="42" font-size="12.5" font-family="IBM Plex Mono, monospace" fill="currentColor">milk, bread, eggs, chicken thighs</text>
      <text x="664" y="42" font-size="12.5" text-anchor="end" fill="currentColor" opacity="0.5">⌕</text>

      <text x="40" y="78" font-size="12" fill="currentColor" opacity="0.7">4 terms · <tspan fill="var(--ok)" font-weight="700">3 available</tspan> · 1 out of stock · you are on Floor 0, Aisle 1</text>

      <text x="40" y="108" font-size="11.5" font-weight="700" letter-spacing="0.08em" fill="var(--ok)">AVAILABLE</text>
      <g font-size="12">
        <rect x="40" y="118" width="640" height="40" rx="3" fill="none" stroke="var(--ok)" stroke-width="1.3" opacity="0.8"/>
        <text x="56" y="135" fill="currentColor">Whole Milk 2 pint</text>
        <text x="56" y="150" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.65">F0 · A04 · R02 · S01</text>
        <text x="664" y="143" text-anchor="end" font-size="11.5" fill="var(--ok)">14 in stock</text>

        <rect x="40" y="164" width="640" height="40" rx="3" fill="none" stroke="var(--ok)" stroke-width="1.3" opacity="0.8"/>
        <text x="56" y="181" fill="currentColor">Hovis Wholemeal 800g</text>
        <text x="56" y="196" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.65">F1 · A07 · R01 · S03</text>
        <text x="664" y="189" text-anchor="end" font-size="11.5" fill="var(--ok)">6 in stock</text>

        <rect x="40" y="210" width="640" height="40" rx="3" fill="none" stroke="var(--ok)" stroke-width="1.3" opacity="0.8"/>
        <text x="56" y="227" fill="currentColor">Free Range Eggs, 6 pack</text>
        <text x="56" y="242" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.65">F0 · A06 · R03 · S02</text>
        <text x="664" y="235" text-anchor="end" font-size="11.5" fill="var(--ok)">21 in stock</text>
      </g>

      <rect x="40" y="264" width="300" height="38" rx="3" fill="color-mix(in srgb, var(--fn) 18%, transparent)" stroke="var(--fn)" stroke-width="2"/>
      <text x="190" y="288" font-size="12.5" font-weight="600" text-anchor="middle" fill="currentColor">Add 3 available to basket</text>
      <text x="356" y="288" font-size="11" fill="currentColor" opacity="0.6">one action — skips the out-of-stock item</text>

      <text x="40" y="340" font-size="11.5" font-weight="700" letter-spacing="0.08em" fill="currentColor" opacity="0.55">OUT OF STOCK</text>
      <rect x="40" y="350" width="640" height="40" rx="3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.45"/>
      <text x="56" y="367" font-size="12" fill="currentColor" opacity="0.6">Chicken Thighs 1kg</text>
      <text x="56" y="382" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.45">usually F0 · A09 · R02 — currently out</text>
      <text x="664" y="375" text-anchor="end" font-size="11.5" fill="currentColor" opacity="0.55">0 in stock</text>

      <rect x="72" y="398" width="608" height="36" rx="3" fill="none" stroke="var(--llm)" stroke-width="1.3" opacity="0.75"/>
      <text x="88" y="414" font-size="11.5" fill="currentColor">Instead: Chicken Drumsticks 1kg · same aisle · 9 in stock</text>
      <text x="88" y="428" font-size="10" fill="currentColor" opacity="0.6">substitute chosen from dietary-filtered candidates only</text>
      <text x="664" y="420" text-anchor="end" font-size="11.5" fill="var(--fn)">+ add</text>

      <line x1="190" y1="302" x2="190" y2="462" stroke="var(--fn)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#h4)"/>

      <rect x="40" y="466" width="640" height="46" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <text x="56" y="486" font-size="12.5" font-weight="600" fill="currentColor">Basket · 3 items</text>
      <text x="56" y="502" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.65">2 floors · ends at the tills</text>
      <rect x="530" y="477" width="134" height="26" rx="3" fill="color-mix(in srgb, var(--fn) 18%, transparent)" stroke="var(--fn)" stroke-width="1.8"/>
      <text x="597" y="495" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Plan route</text>

      <text x="40" y="542" font-size="11" fill="currentColor" opacity="0.65">The basket — not the search result — is what routing reads, so no route is ever planned to an empty shelf.</text>
      <text x="40" y="562" font-size="11" fill="currentColor" opacity="0.65">An out-of-stock item can be added individually, but it is flagged not routable and left out of the path.</text>
    </g>
  </svg>
  </div>
  <figcaption><b>Available first, then one action.</b> The bulk action only ever moves in-stock items, so the basket contains only things that can actually be walked to. Adding an out-of-stock item individually stays possible — for a shopper who intends to ask a colleague — but it is excluded from the route rather than silently breaking it.</figcaption>
</figure>
