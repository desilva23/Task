<figure>
  <div class="legend">
    <span><i class="chip" style="border-color: var(--fn); background: color-mix(in srgb, var(--fn) 14%, transparent)"></i> deterministic</span>
    <span><i class="chip" style="border-color: var(--llm); background: color-mix(in srgb, var(--llm) 14%, transparent)"></i> model call</span>
    <span><i class="chip" style="border-color: var(--pause); background: color-mix(in srgb, var(--pause) 14%, transparent)"></i> human pause</span>
    <span><i class="chip" style="border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent)"></i> verification gate</span>
  </div>
  <div class="scroller">
  <svg viewBox="0 0 800 580" role="img" aria-label="Five-layer design. A Next.js page calls a stateless FastAPI function over HTTPS, which runs the compiled LangGraph. The graph holds eleven nodes in three rows: classify query, understand query, resolve items and clarify; check availability, suggest substitutes and resolve locations; route single, route multi, describe route and verify. Below the graph sit the search stages, then the catalogue, planogram, stock and routing services, then six CSV files validated at load.">
    <defs><marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><polygon points="0,0 10,4 0,8" fill="currentColor"/></marker></defs>
    <g font-family="IBM Plex Sans Condensed, sans-serif">

      <rect x="30" y="14" width="740" height="76" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="44" y="36" font-size="12.5" font-weight="700" fill="currentColor">PAGE — Next.js, one static page</text>
      <g font-size="11" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.8">
        <rect x="44" y="48" width="170" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="0.45"/>
        <text x="129" y="62" text-anchor="middle">search form</text>
        <text x="129" y="75" text-anchor="middle" font-size="10">and the barcode scan</text>
        <rect x="222" y="48" width="150" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="0.45"/>
        <text x="297" y="62" text-anchor="middle">position picker</text>
        <text x="297" y="75" text-anchor="middle" font-size="10">floor + aisle</text>
        <rect x="380" y="48" width="110" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="0.45"/>
        <text x="435" y="68" text-anchor="middle">basket</text>
        <rect x="498" y="48" width="258" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="0.45"/>
        <text x="627" y="62" text-anchor="middle">3 floor plates · route overlay</text>
        <text x="627" y="75" text-anchor="middle" font-size="10">directions list · floor switcher</text>
      </g>

      <line x1="400" y1="90" x2="400" y2="122" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>
      <text x="412" y="103" font-size="11" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.72">HTTPS · JSON — /api/search · /api/scan · /api/route</text>

      <rect x="30" y="126" width="740" height="152" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="44" y="148" font-size="12.5" font-weight="700" fill="currentColor">ORCHESTRATION — LangGraph, 11 nodes on explicit edges</text>
      <g font-size="11" font-family="IBM Plex Mono, monospace" fill="currentColor">
        <rect x="44" y="158" width="170" height="26" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        <text x="129" y="175" text-anchor="middle" opacity="0.85">classify_query</text>
        <rect x="224" y="158" width="170" height="26" rx="2" fill="none" stroke="var(--llm)" stroke-width="1.4"/>
        <text x="309" y="175" text-anchor="middle" fill="var(--llm)">understand_query</text>
        <rect x="404" y="158" width="170" height="26" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        <text x="489" y="175" text-anchor="middle" opacity="0.85">resolve_items</text>
        <rect x="584" y="158" width="170" height="26" rx="2" fill="none" stroke="var(--pause)" stroke-width="1.4"/>
        <text x="669" y="175" text-anchor="middle" fill="var(--pause)">clarify · interrupt()</text>

        <rect x="44" y="192" width="230" height="26" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        <text x="159" y="209" text-anchor="middle" opacity="0.85">check_availability</text>
        <rect x="284" y="192" width="230" height="26" rx="2" fill="none" stroke="var(--llm)" stroke-width="1.4"/>
        <text x="399" y="209" text-anchor="middle" fill="var(--llm)">suggest_substitutes</text>
        <rect x="524" y="192" width="230" height="26" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        <text x="639" y="209" text-anchor="middle" opacity="0.85">resolve_locations</text>

        <rect x="44" y="226" width="170" height="26" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        <text x="129" y="243" text-anchor="middle" opacity="0.85">route_single</text>
        <rect x="224" y="226" width="170" height="26" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        <text x="309" y="243" text-anchor="middle" opacity="0.85">route_multi</text>
        <rect x="404" y="226" width="170" height="26" rx="2" fill="none" stroke="var(--llm)" stroke-width="1.4"/>
        <text x="489" y="243" text-anchor="middle" fill="var(--llm)">describe_route</text>
        <rect x="584" y="226" width="170" height="26" rx="2" fill="none" stroke="var(--ok)" stroke-width="1.6"/>
        <text x="669" y="243" text-anchor="middle" fill="var(--ok)">verify</text>
      </g>
      <text x="44" y="268" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--ok)" opacity="0.9">nothing reaches the page until verify has matched every claim against the services</text>

      <line x1="400" y1="278" x2="400" y2="310" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>
      <text x="412" y="297" font-size="11" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.72">resolve_items calls ↓</text>

      <rect x="30" y="314" width="740" height="58" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="44" y="336" font-size="12.5" font-weight="700" fill="currentColor">SEARCH</text>
      <text x="44" y="358" font-size="11.5" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.78">exact name → BM25 lexical → fuzzy fallback → structured filter → retail ranking</text>

      <line x1="400" y1="372" x2="400" y2="404" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>

      <rect x="30" y="408" width="740" height="58" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="44" y="430" font-size="12.5" font-weight="700" fill="currentColor">SERVICES — plain Python, no web or model dependency</text>
      <text x="44" y="452" font-size="11.5" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.78">catalogue · planogram · stock · routing (all-pairs Dijkstra matrix + floor-clustered TSP)</text>

      <line x1="400" y1="466" x2="400" y2="498" stroke="currentColor" stroke-width="1.5" marker-end="url(#ah)"/>

      <rect x="30" y="502" width="740" height="64" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="44" y="524" font-size="12.5" font-weight="700" fill="currentColor">DATA — six CSV files, one store folder</text>
      <text x="44" y="543" font-size="11.5" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.78">products · planogram · stock · map_nodes · map_edges · store meta</text>
      <text x="44" y="558" font-size="11" fill="currentColor" opacity="0.7">validated at load — 314 nodes, ~700 directed edges, 3 floors, 2 vertical cores</text>
    </g>
  </svg>
  </div>
  <figcaption><b>Only the bottom layer is specific to a store.</b> Everything above it is identical for every store, which is what FR-25 means in practice. The three amber nodes are the only places a model is called, and none of them returns a location, a distance or a stock figure — those come up from the services. The green node is the gate: it re-checks the composed answer against those same service results before the page renders anything.</figcaption>
</figure>
