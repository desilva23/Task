# The same check as scripts/check.sh, from the lock files, on the Python in .python-version (3.12)
# and Node 24 — Vercel's default.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # publishes full version tags only — no moving v10
      - run: uv sync --locked
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: uv run playwright install --with-deps chromium  # AC-15, AC-28 — the 390 px browser tests
      - run: scripts/check.sh
