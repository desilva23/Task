[project]
name = "product-locator"
version = "0.1.0"
description = "Multi-floor store product finder and navigation agent — proof of concept on synthetic data"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".specify", ".claude", "*.md"]  # docs align code by hand; the spec is not code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-p", "pytester"]
