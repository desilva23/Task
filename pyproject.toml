[project]
name = "product-locator"
version = "0.1.0"
description = "Multi-floor store product finder and navigation agent — proof of concept on synthetic data"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.143.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.15",
    "pydantic>=2.14.1",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "playwright>=1.64.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
    "zxing-cpp>=3.1.1",
    "pillow>=12.3.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".specify", ".claude", "*.md"]  # docs align code by hand; the spec is not code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; what remains is unsplittable text

[tool.ruff.lint.per-file-ignores]
"scripts/render_*_page.py" = ["E701", "E702"]  # compact page renderers, not app code

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-p", "pytester", "-m", "not live"]
markers = ["live: calls GroqCloud with the owner's key; run on demand with -m live"]
