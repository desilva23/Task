[project]
name = "product-locator"
version = "0.1.0"
description = "Multi-floor store product finder and navigation agent — proof of concept on synthetic data"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".specify", ".claude", "*.md"]  # docs align code by hand; the spec is not code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; what remains is unsplittable text

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-p", "pytester"]
